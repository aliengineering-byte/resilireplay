name: Feature request
description: Propose a bounded reliability-testing capability.
title: "[feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Reliability problem
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Deterministic oracle
      description: Explain how the feature can be scored without an LLM judge.
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety boundary
      description: Describe filesystem, subprocess, network, and credential implications.
    validations:
      required: true
