name: Bug report
description: Report a reproducible ResiliReplay defect without private trace data.
title: "[bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not attach credentials, production traces, or sensitive MCP output.
  - type: input
    id: version
    attributes:
      label: ResiliReplay version
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, Linux, macOS, Other]
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Include a sanitized toy trace or scenario when possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
