name: MCP compatibility result
description: Share a passing, failing, or blocked pinned compatibility result
title: "[MCP compatibility]: "
labels: [compatibility]
body:
  - type: markdown
    attributes:
      value: Use a public or disposable target. Remove credentials, private paths, production traces, and personal data.
  - type: input
    id: versions
    attributes:
      label: Exact versions
      description: ResiliReplay version plus server package version and source revision.
      placeholder: resilireplay@0.6.0; @scope/server@1.2.3; gitHead abc123; integrity sha512-...
    validations:
      required: true
  - type: dropdown
    id: transport
    attributes:
      label: Transport
      options: [stdio, Streamable HTTP, legacy SSE]
    validations:
      required: true
  - type: textarea
    id: boundary
    attributes:
      label: Authorization and side-effect boundary
      description: Name the exact target, allowed tools, data class, network boundary, and cleanup performed.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal sanitized reproduction
      description: Include the evidence profile/level, config, campaign, reviewed hashes, exact commands, expected result, actual result, and limitations.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety confirmation
      options:
        - label: I was authorized to test this target and removed secrets, personal data, and unsafe payloads.
          required: true
        - label: I reported invalid, incomplete, and setup-blocked attempts without converting them into passes.
          required: true
