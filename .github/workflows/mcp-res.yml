name: MCP-RES

on:
  push:
    branches: [main]
    paths:
      - "docs/standards/mcp-res/**"
      - "README.md"
      - "docs/index.html"
      - "package.json"
      - "pnpm-lock.yaml"
      - "scripts/check-site.mjs"
      - "scripts/site-browser-test.mjs"
      - "scripts/export-mcp-res-reference.mjs"
      - "scripts/generate-mcp-res-vectors.mjs"
      - "scripts/generate-mcp-res-v02-vectors.mjs"
      - "scripts/package-mcp-res-release.mjs"
      - "scripts/package-mcp-res-v02-release.mjs"
      - "scripts/generate-mcp-res-sbom.mjs"
      - "scripts/migrate-mcp-res-v01-to-v02.mjs"
      - "scripts/reference-mcp-res-validator.mjs"
      - "scripts/verify-mcp-res.mjs"
      - "scripts/verify-mcp-res-v02.mjs"
      - "scripts/verify-mcp-res-attestations.mjs"
      - "scripts/verify-mcp-res-migration.mjs"
      - "scripts/verify-mcp-res-python.mjs"
      - "scripts/verify-mcp-res-provenance.mjs"
      - ".github/workflows/mcp-res.yml"
      - ".github/workflows/mcp-res-release.yml"
  pull_request:
    paths:
      - "docs/standards/mcp-res/**"
      - "README.md"
      - "docs/index.html"
      - "package.json"
      - "pnpm-lock.yaml"
      - "scripts/check-site.mjs"
      - "scripts/site-browser-test.mjs"
      - "scripts/export-mcp-res-reference.mjs"
      - "scripts/generate-mcp-res-vectors.mjs"
      - "scripts/generate-mcp-res-v02-vectors.mjs"
      - "scripts/package-mcp-res-release.mjs"
      - "scripts/package-mcp-res-v02-release.mjs"
      - "scripts/generate-mcp-res-sbom.mjs"
      - "scripts/migrate-mcp-res-v01-to-v02.mjs"
      - "scripts/reference-mcp-res-validator.mjs"
      - "scripts/verify-mcp-res.mjs"
      - "scripts/verify-mcp-res-v02.mjs"
      - "scripts/verify-mcp-res-attestations.mjs"
      - "scripts/verify-mcp-res-migration.mjs"
      - "scripts/verify-mcp-res-python.mjs"
      - "scripts/verify-mcp-res-provenance.mjs"
      - ".github/workflows/mcp-res.yml"
      - ".github/workflows/mcp-res-release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcp-res-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    name: Conformance / ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.14.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Record exact toolchain
        run: |
          node --version
          pnpm --version
      - run: pnpm install --frozen-lockfile
      - name: Compile schemas and execute conformance/mutation/reference checks
        run: pnpm mcp-res:validate
      - name: Build reproducible draft release attachments
        run: pnpm mcp-res:package
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - run: pnpm package:smoke
      - name: Build-check Pages content and local links
        run: pnpm site:check
      - name: Install Chromium and Linux dependencies
        if: matrix.node == 24 && runner.os == 'Linux'
        run: pnpm exec playwright install --with-deps chromium
      - name: Install Chromium on Windows
        if: matrix.node == 24 && runner.os == 'Windows'
        run: pnpm exec playwright install chromium
      - name: Responsive and WCAG A/AA Pages checks
        if: matrix.node == 24
        run: pnpm site:test
      - name: Upload conformance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mcp-res-${{ runner.os }}-node-${{ matrix.node }}
          if-no-files-found: error
          retention-days: 30
          path: |
            .artifacts/mcp-res/verification.json
            .artifacts/mcp-res-v02/verification.json
            .artifacts/mcp-res-v02/python-verification.json
            .artifacts/mcp-res-release/**
            .artifacts/mcp-res-v02-release/**
            .artifacts/site/mcp-res-*.png
            docs/standards/mcp-res/v0.1.0/field-evidence/*.json
            docs/standards/mcp-res/v0.1.0/test-vectors/SHA256SUMS
            docs/standards/mcp-res/v0.2.0/test-vectors/SHA256SUMS
