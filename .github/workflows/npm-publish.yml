name: Publish npm package

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'aliengineering-byte/resilireplay' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.14.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
      - name: Verify release tag and package version
        shell: bash
        run: |
          package_version="$(node --print "require('./packages/cli/package.json').version")"
          if [[ "v${package_version}" != "${GITHUB_REF_NAME}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match resilireplay ${package_version}." >&2
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm quality
      - name: Publish with npm Trusted Publishing
        run: npm publish packages/cli --access public
