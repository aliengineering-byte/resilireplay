name: Release verification

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # pnpm quality includes a fail-closed new-commit attribution audit.
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.14.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm quality
      - run: pnpm demo
      - run: pnpm demo:mcp
      - run: pnpm demo:studio
      - run: pnpm release:gates
      - run: pnpm mcp:example:verify
      - run: pnpm agent:gates
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        with:
          name: resilireplay-release-evidence
          path: |
            runs/demo
            runs/mcp-inspector-demo
            .artifacts/studio-demo
            .artifacts/release-gates/report.json
            .artifacts/agent-release-gates/report.json
          retention-days: 30
