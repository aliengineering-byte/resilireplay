name: Release verification

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm quality
      - run: pnpm demo
      - run: pnpm demo:mcp
      - uses: actions/upload-artifact@v4
        with:
          name: resilireplay-v0.1-evidence
          path: |
            runs/demo
            runs/mcp-demo
          retention-days: 30
