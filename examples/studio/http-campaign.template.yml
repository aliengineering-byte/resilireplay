schemaVersion: "1.0"
kind: resilireplay-campaign
id: studio-http-control
description: Template used by the verified demo against the real local Streamable HTTP fixture.
seed: 42
budgets:
  concurrency: 1
  retries: 1
  scenarioTimeoutMs: 10000
  totalTimeoutMs: 30000
targets:
  - id: resilient-http
    kind: mcp
    inspectorConfig: .artifacts/studio-demo/http-mcp.json
    server: resilient-http
    allowTools:
      - reliability_probe
    allowRemote: false
scenarios:
  - id: http-negative-control
    target: resilient-http
    fault: none
    recovery: none
    assertions:
      outcome: passed
      maxRetries: 0
      noDuplicateSideEffects: true
      safetyPolicyCompliance: true
  - id: http-bounded-retry
    target: resilient-http
    fault: mcp-tool-error
    recovery: retry
    assertions:
      outcome: passed
      safeRecovery: true
      maxRetries: 1
      noDuplicateSideEffects: true
      safetyPolicyCompliance: true
thresholds:
  maxScoreDrop: 0
  maxRetryIncrease: 0
  maxDuplicateSideEffectIncrease: 0
