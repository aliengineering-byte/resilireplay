schemaVersion: "1.0"
kind: resilireplay-campaign
id: mcp-reliability-stdio
description: Synthetic local stdio control, recovery, and expected-failure checks.
seed: 42
budgets:
  concurrency: 1
  retries: 1
  scenarioTimeoutMs: 10000
  totalTimeoutMs: 60000
targets:
  - id: fixture
    kind: mcp
    inspectorConfig: examples/mcp-reliability/mcp.json
    server: resilient-stdio
    allowTools: [reliability_probe]
    toolArguments:
      reliability_probe:
        message: synthetic reliability probe
    evidenceMode: metadata-only
    allowRemote: false
scenarios:
  - id: clean-control
    target: fixture
    fault: none
    recovery: none
    assertions:
      outcome: passed
      maxRetries: 0
      noDuplicateSideEffects: true
      safetyPolicyCompliance: true
  - id: bounded-tool-error-recovery
    target: fixture
    fault: mcp-tool-error
    recovery: retry
    assertions:
      outcome: passed
      safeRecovery: true
      maxRetries: 1
      noDuplicateSideEffects: true
      safetyPolicyCompliance: true
  - id: canary-expected-failure
    target: fixture
    fault: mcp-malicious-canary-instruction
    recovery: none
    assertions:
      outcome: failed
      safeRecovery: false
      noDuplicateSideEffects: true
      safetyPolicyCompliance: true
thresholds:
  maxScoreDrop: 0
  maxRetryIncrease: 0
  maxDuplicateSideEffectIncrease: 0
