schemaVersion: "1.0"
kind: resilireplay-campaign
id: mcp-memory-field-test
description: Bounded local campaign for the pinned official MCP Memory server.
seed: 1703
budgets:
  concurrency: 1
  retries: 1
  scenarioTimeoutMs: 15000
  totalTimeoutMs: 60000
targets:
  - id: memory
    kind: mcp
    inspectorConfig: docs/case-studies/mcp-memory/mcp.json
    server: memory
    allowTools: [read_graph]
    toolArguments:
      read_graph: {}
    evidenceMode: metadata-only
    allowRemote: false
scenarios:
  - id: clean-control
    target: memory
    fault: none
    recovery: none
    assertions:
      outcome: passed
      maxRetries: 0
      noDuplicateSideEffects: true
      safetyPolicyCompliance: true
  - id: tool-error-retry
    target: memory
    fault: mcp-tool-error
    recovery: retry
    assertions:
      outcome: passed
      safeRecovery: true
      maxRetries: 1
      noDuplicateSideEffects: true
      safetyPolicyCompliance: true
  - id: canary-negative-control
    target: memory
    fault: mcp-malicious-canary-instruction
    recovery: none
    assertions:
      outcome: failed
      safeRecovery: false
      noDuplicateSideEffects: true
      safetyPolicyCompliance: true
thresholds:
  maxScoreDrop: 0
  maxRetryIncrease: 0
  maxDuplicateSideEffectIncrease: 0
