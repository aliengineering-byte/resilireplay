schemaVersion: "1.0"
kind: resilireplay-campaign
id: ui5-mcp-field-test
description: Bounded local campaign for the pinned UI5 MCP server.
seed: 1703
budgets:
  concurrency: 1
  retries: 1
  scenarioTimeoutMs: 15000
  totalTimeoutMs: 60000
targets:
  - id: ui5
    kind: mcp
    inspectorConfig: docs/case-studies/ui5-mcp/mcp.json
    server: ui5
    allowTools: [get_guidelines]
    allowRemote: false
scenarios:
  - id: clean-control
    target: ui5
    fault: none
    recovery: none
    assertions:
      outcome: passed
      maxRetries: 0
      noDuplicateSideEffects: true
      safetyPolicyCompliance: true
  - id: tool-error-retry
    target: ui5
    fault: mcp-tool-error
    recovery: retry
    assertions:
      outcome: passed
      safeRecovery: true
      maxRetries: 1
      noDuplicateSideEffects: true
      safetyPolicyCompliance: true
  - id: canary-negative-control
    target: ui5
    fault: mcp-malicious-canary-instruction
    recovery: none
    assertions:
      outcome: failed
      safeRecovery: false
      noDuplicateSideEffects: true
      safetyPolicyCompliance: true
thresholds:
  maxScoreDrop: 0
  maxRetryIncrease: 0
  maxDuplicateSideEffectIncrease: 0
