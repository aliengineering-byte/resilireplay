schemaVersion: "1.0"
kind: resilireplay-campaign
id: mcp-everything-field-test
description: Bounded local campaign for the pinned official MCP Everything server.
seed: 1701
budgets:
  concurrency: 1
  retries: 1
  scenarioTimeoutMs: 15000
  totalTimeoutMs: 60000
targets:
  - id: everything
    kind: mcp
    inspectorConfig: docs/case-studies/mcp-everything/mcp.json
    server: everything
    allowTools: [echo]
    allowRemote: false
scenarios:
  - id: clean-control
    target: everything
    fault: none
    recovery: none
    assertions:
      outcome: passed
      maxRetries: 0
      noDuplicateSideEffects: true
      safetyPolicyCompliance: true
  - id: tool-error-retry
    target: everything
    fault: mcp-tool-error
    recovery: retry
    assertions:
      outcome: passed
      safeRecovery: true
      maxRetries: 1
      noDuplicateSideEffects: true
      safetyPolicyCompliance: true
  - id: canary-negative-control
    target: everything
    fault: mcp-malicious-canary-instruction
    recovery: none
    assertions:
      outcome: failed
      safeRecovery: false
      noDuplicateSideEffects: true
      safetyPolicyCompliance: true
thresholds:
  maxScoreDrop: 0
  maxRetryIncrease: 0
  maxDuplicateSideEffectIncrease: 0
