schemaVersion: "1.0"
kind: resilireplay-campaign
id: playwright-mcp-field-test
description: Bounded headless campaign for the pinned Playwright MCP server.
seed: 1702
budgets:
  concurrency: 1
  retries: 1
  scenarioTimeoutMs: 25000
  totalTimeoutMs: 90000
targets:
  - id: playwright
    kind: mcp
    inspectorConfig: docs/case-studies/playwright-mcp/mcp.json
    server: playwright
    allowTools: [browser_snapshot]
    allowRemote: false
scenarios:
  - id: clean-control
    target: playwright
    fault: none
    recovery: none
    assertions:
      outcome: passed
      maxRetries: 0
      noDuplicateSideEffects: true
      safetyPolicyCompliance: true
  - id: tool-error-retry
    target: playwright
    fault: mcp-tool-error
    recovery: retry
    assertions:
      outcome: passed
      safeRecovery: true
      maxRetries: 1
      noDuplicateSideEffects: true
      safetyPolicyCompliance: true
  - id: canary-negative-control
    target: playwright
    fault: mcp-malicious-canary-instruction
    recovery: none
    assertions:
      outcome: failed
      safeRecovery: false
      noDuplicateSideEffects: true
      safetyPolicyCompliance: true
thresholds:
  maxScoreDrop: 0
  maxRetryIncrease: 0
  maxDuplicateSideEffectIncrease: 0
