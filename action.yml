name: ResiliReplay — Agent and MCP Reliability Tests
author: Ali
description: Run deterministic fault campaigns, verify recovery, compare reliability baselines, and generate AI-agent and MCP regressions.
inputs:
  scenarios:
    description: Scenario directory
    required: false
    default: scenarios
  campaign:
    description: Optional campaign YAML/JSON path; when set, the scenario directory is not run
    required: false
    default: ""
  campaign-confirmation-hash:
    description: Exact reviewed hash required only when the campaign allowlists tool calls
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Build the immutable Action source
      shell: bash
      working-directory: ${{ github.action_path }}
      run: corepack enable && pnpm install --frozen-lockfile && pnpm build
    - name: Run the reliability campaign
      shell: bash
      env:
        RESILIREPLAY_ACTION_ROOT: ${{ github.action_path }}
        RESILIREPLAY_ACTION_SCENARIOS: ${{ inputs.scenarios }}
        RESILIREPLAY_ACTION_CAMPAIGN: ${{ inputs.campaign }}
        RESILIREPLAY_ACTION_CONFIRMATION: ${{ inputs.campaign-confirmation-hash }}
      run: |
        if [[ -n "$RESILIREPLAY_ACTION_CAMPAIGN" ]]; then
          arguments=(campaign run "$RESILIREPLAY_ACTION_CAMPAIGN")
          if [[ -n "$RESILIREPLAY_ACTION_CONFIRMATION" ]]; then
            arguments+=(--confirm-tools "$RESILIREPLAY_ACTION_CONFIRMATION")
          fi
          node "$RESILIREPLAY_ACTION_ROOT/packages/cli/dist/bin.js" "${arguments[@]}"
        else
          node "$RESILIREPLAY_ACTION_ROOT/packages/cli/dist/bin.js" test "$RESILIREPLAY_ACTION_SCENARIOS"
        fi
branding:
  icon: activity
  color: purple
